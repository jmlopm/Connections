<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="1;URL=https://www.youtube.com/watch?v=dQw4w9WgXcQ">
    <title>Mini Connections</title>

    <!-- ——— META PARA PREVIEW AL COMPARTIR ——— -->
    <meta property="og:title" content="Connections+" />
    <meta property="og:description" content="Has perdido" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://connectionsplus.io/logo/og-image.png">

    <!-- Favicon (icono en pestaña y redes) → reemplaza por tu icono -->

    <!-- ——— ESTILOS ——— -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 120px);
            grid-template-rows: repeat(4, 120px);
            gap: 10px;
        }

        .cell {
            background: #fff;
            border: 2px solid #bbb;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }

        .cell:hover {
            background: #e8e8e8;
        }

        .cell.selected {
            background: #b7d4ff;
            border-color: #4788ff;
        }
    </style>
</head>
<body>

    <!-- ——— TABLERO 4×4 ——— -->
    <div class="board" id="board">
        <!-- Aquí pones tus palabras “a pelo” -->
        <div class="cell">| _</div>
        <div class="cell">| ¡</div>
        <div class="cell">XXVII</div>
        <div class="cell">YOU UP</div>

        <div class="cell">| |</div>
        <div class="cell">|</div>
        <div class="cell">GIVE</div>
        <div class="cell">GENERACION</div>

        <div class="cell">HAS</div>
        <div class="cell">PERDIDO</div>
        <div class="cell">X</div>
        <div class="cell">D</div>

        <div class="cell">ADIOS</div>
        <div class="cell">NEVER</div>
        <div class="cell">UE</div>
        <div class="cell">GONNA</div>
    </div>

    <!-- ——— JS: seleccionar palabras ——— -->
    <script>
        const cells = document.querySelectorAll(".cell");
        cells.forEach(cell => {
            cell.addEventListener("click", () => {
                cell.classList.toggle("selected");
            });
        });
    </script>

</body>
</html>
